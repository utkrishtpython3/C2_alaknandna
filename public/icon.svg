<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="60%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Tactical Hex-Shield Base -->
  <path d="M60 6 L108 22 L108 68 C108 92 84 110 60 116 C36 110 12 92 12 68 L12 22 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#goldBorder)" 
        stroke-width="3.5" 
        stroke-linejoin="round" />

  <!-- Tri-color National Header Strip -->
  <path d="M26 24 L60 13 L94 24" stroke="#ff9933" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M28 29 L60 19 L92 29" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.9" stroke-linecap="round"/>
  <path d="M30 34 L60 25 L90 34" stroke="#138808" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Radar Pulse Rings -->
  <circle cx="60" cy="62" r="32" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.4" />
  <circle cx="60" cy="62" r="22" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6" />
  <circle cx="60" cy="62" r="12" stroke="#38bdf8" stroke-width="0.8" opacity="0.8" />

  <!-- Himalayan Mountain Peak Silhouette -->
  <polygon points="60,34 78,68 42,68" fill="url(#mountainGrad)" />
  <polygon points="60,34 66,50 60,46 54,50" fill="#ffffff" />
  <polygon points="40,48 54,72 26,72" fill="#64748b" opacity="0.8" />
  <polygon points="80,48 94,72 66,72" fill="#475569" opacity="0.8" />

  <!-- Rushing Debris & Flood Surge Waves -->
  <path d="M20 76 Q40 66 60 76 T100 76 L100 84 Q80 74 60 84 T20 84 Z" fill="url(#waveGrad)" />
  <path d="M18 84 Q38 76 60 86 T102 86 L102 92 C96 99 82 106 60 112 C38 106 24 99 18 92 Z" fill="#0369a1" opacity="0.9" />

  <!-- Central Early-Warning Flash Beacon -->
  <circle cx="60" cy="62" r="4" fill="#f59e0b" filter="url(#glow)" />
  <circle cx="60" cy="62" r="2" fill="#ffffff" />

  <!-- NDRF Star / Alert Symbol -->
  <path d="M60 52 L62 58 L68 60 L62 62 L60 68 L58 62 L52 60 L58 58 Z" fill="#fbbf24" opacity="0.85" />
</svg>
